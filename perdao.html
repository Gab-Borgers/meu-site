<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120b13">
<title>Você me ama? — para a minha Carol ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="hearts" aria-hidden="true"></div>
<main class="perdao-main">
<section class="perdao-screen" id="perguntaScreen">
<div class="tiny-heart">♡</div>
<h1 class="perdao-title">Você me<br><span>AMA?</span></h1>
<div class="perdao-buttons">
<button class="perdao-btn yes" id="simBtn" type="button">Muito</button>
<button class="perdao-btn no" id="naoBtn" type="button">Pouco</button>
</div>
</section>

<section class="perdao-screen hidden" id="respostaScreen">
<div class="tiny-heart">♡</div>
<h2 class="perdao-resposta">Nunca duvidei 😁</h2>
<a class="back-link big" href="index.html">← voltar pro início</a>
</section>
</main>
<script src="script.js"></script>
<script>
const naoBtn = document.getElementById('naoBtn');
const simBtn = document.getElementById('simBtn');
const perguntaScreen = document.getElementById('perguntaScreen');
const respostaScreen = document.getElementById('respostaScreen');

naoBtn.addEventListener('click', () => {
  const margin = 16;
  const maxX = window.innerWidth - naoBtn.offsetWidth - margin;
  const maxY = window.innerHeight - naoBtn.offsetHeight - margin;
  const x = Math.max(margin, Math.random() * maxX);
  const y = Math.max(margin, Math.random() * maxY);
  naoBtn.style.position = 'fixed';
  naoBtn.style.left = x + 'px';
  naoBtn.style.top = y + 'px';
});

simBtn.addEventListener('click', () => {
  perguntaScreen.classList.add('hidden');
  respostaScreen.classList.remove('hidden');
});
</script>
</body>
</html>
