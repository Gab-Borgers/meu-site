<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <div class="hearts" aria-hidden="true"></div>

      <a class="back-link" href="index.html">← voltar</a>
      <p class="eyebrow">só nós dois</p>
      <h1>Nossos<br><span>momentos.</span></h1>

    <section class="gallery-grid">
      <figure><img src="assets/galeria/foto1.jpg" alt="Você e eu" loading="lazy"></figure>

      <figure><img src="assets/galeria/foto9.jpg" alt="Você e eu" loading="lazy"></figure>

    <section class="final">
      <div class="tiny-heart">♡</div>
      <h2>Quero mais fotos<br>como essas.</h2>
      <p>Com você, do jeito certo, prestando atenção em quem importa.</p>
      <a class="back-link big" href="index.html">← voltar pro início</a>

  <script src="script.js"></script>
